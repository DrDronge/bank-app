apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-pvc
  namespace: bank-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: bank-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: localhost:30500/keycloak:26.5.7-bank.5
          args: ["start", "--import-realm"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: keycloak-secret
          env:
            - name: KC_HOSTNAME
              value: "https://auth.madpro.dk"
            # Admin console only via port-forward; /admin is blocked publicly in the apps tunnel.
            - name: KC_HOSTNAME_ADMIN
              value: "http://localhost:8080"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # KC_DB_USERNAME/KC_DB_PASSWORD come from keycloak-secret (DB "keycloak" in the shared Postgres).
            # One replica: no JGroups cluster (avoids errors during rolling updates).
            - name: KC_CACHE
              value: "local"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import
            # Keycloak's gzip cache for theme resources lives here, keyed by Keycloak version, not theme:
            # on the PVC it served stale CSS after theme changes.
            - name: tmp
              mountPath: /opt/keycloak/data/tmp
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-pvc
        - name: realm
          configMap:
            name: keycloak-realm
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: bank-app
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
